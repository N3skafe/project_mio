[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maidops-trainer"
version = "0.5.0"
description = "MaidOps Lab trainer. Frozen hashing embeddings and a small PyTorch MLP."
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "torch==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
maidops-trainer = "maidops_trainer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
