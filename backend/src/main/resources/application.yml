server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: maidops-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/maidops}
    username: ${SPRING_DATASOURCE_USERNAME:maidops}
    password: ${SPRING_DATASOURCE_PASSWORD:maidops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

maidops:
  event-limit: 500
  workspace-root: ${MAIDOPS_WORKSPACE_ROOT:}
  lease-seconds: 15
  worker-heartbeat-window-seconds: 20
  lease-sweep-ms: 5000
  model-dir: ${MAIDOPS_MODEL_DIR:data/models}
  training-lease-seconds: 120
  inference-lease-seconds: 600

logging:
  level:
    org.hibernate.SQL: warn
