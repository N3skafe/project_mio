[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maidops-tui"
version = "0.1.0"
description = "MaidOps Lab terminal UI"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "textual==8.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
maidops-lab = "maidops_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maidops_tui = ["styles/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
